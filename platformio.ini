; PlatformIO Project Configuration for Waveshare ESP32-S3-Touch-LCD-7 (Rev 1.2)
; Target: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB OPI PSRAM)
; Application: RPT Battery CAN Bus Passive Scanner (Phase 1)

[platformio]
default_envs = esp32-s3-touch-lcd-7

[env:esp32-s3-touch-lcd-7]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; MCU and Clock settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; 16MB Flash and 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Compiler & Build flags
build_flags =
    -DESP32_S3_TOUCH_LCD_7=1
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -I include
